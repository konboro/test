# Calls the sweep once an hour, so the sending hour a tenant chooses is real.
#
# Vercel's Hobby plan runs one cron a day, which is enough to decide *which*
# day a reminder falls on and useless for deciding what time it leaves. Every
# tenant would have been swept at the same moment and the hour in the settings
# would have been a control that saved a value and changed nothing.
#
# The endpoint is the same one Vercel calls and takes the same shared secret, so
# this adds a caller rather than a second code path. It is safe to fire every
# hour: the sweep skips any tenant whose chosen hour is not the current one, and
# the once-per-invoice-per-step index makes a double firing a no-op rather than
# a second message.
#
# One thing has to be set for this to do anything: the repository secret
# CRON_SECRET, holding the same value as the Vercel environment variable. The
# sweep reads the hour unconditionally now — it used to sit behind a second flag
# that was never set, which made the setting a control that saved a value and
# changed nothing.
#
# GitHub schedules on UTC and runs a scheduled job late under load, sometimes by
# many minutes, and drops one outright now and then. The sweep is built for
# that: a tenant's window opens at their hour and stays open for the rest of
# their day, so a call that never arrives costs a late reminder rather than a
# silent day with none. The unique index on (debtor_id, contact_on) is what
# makes the extra calls free.
#
# GitHub also only schedules workflows that exist on the repository's DEFAULT
# branch, and disables schedules on a repository with no activity for 60 days.
# Both are silent. If reminders stop leaving at the chosen hour, look here first.

name: dunning-hourly

on:
  schedule:
    - cron: '5 * * * *'
  # So a person can prove it works without waiting for the top of an hour.
  workflow_dispatch:

# One sweep at a time. A run that overlaps its predecessor would work correctly
# — the claims are in the database — but it would double the load for nothing.
concurrency:
  group: dunning-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call the sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set on this repository — nothing to call with."
            exit 1
          fi

          # --max-time rather than the default: a sweep that hangs should fail
          # the run and be visible, not hold a runner for six minutes.
          status=$(curl --silent --show-error --max-time 300 \
            --output response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            https://lefta.app/api/cron/dunning)

          echo "HTTP ${status}"
          cat response.json || true
          echo

          test "${status}" = "200"
